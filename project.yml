name: Stash
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.angar2
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_APP_SANDBOX: "NO"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  # TASK-102 자동 업데이트 (TECH-STACK §3-6). 이정표 조회 → 서명 검증 → 번들 교체 → 재실행 담당.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"

targets:
  Stash:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angar2.stash
        PRODUCT_MODULE_NAME: stash
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: Sources/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "NO"
        # build 번호 디버그 빌드 기본값 — 릴리스(build-dmg.sh)는 git 커밋 수로 오버라이드 (TASK-096)
        CURRENT_PROJECT_VERSION: "1"
      # 배포 빌드만 Developer ID 서명 + Hardened Runtime (TASK-108). 공증의 전제 조건이다.
      # 서명 요건이 번들 ID + 팀 ID 로 고정되어 업데이트 뒤에도 손쉬운 사용 권한이 유지된다.
      # Debug 는 기존 로컬 서명 그대로 둔다 (코드 테스트·개발 빌드에 인증서 불필요).
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: L7J8SQ9T5F
          ENABLE_HARDENED_RUNTIME: "YES"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
    dependencies:
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: GRDB
        product: GRDB
      - package: Sparkle
        product: Sparkle
    # TASK-112 — 묶음에 Sparkle 이 빠지면 빌드를 멈춘다 (App Store판과 섞임 방지). 아카이브(build-dmg.sh)에서도 돈다.
    postBuildScripts:
      - name: 배포판 묶음 검사
        script: '"${SRCROOT}/Scripts/verify-app-bundle.sh" dmg "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"'
        basedOnDependencyAnalysis: false

  # TASK-112 — Mac App Store판. 같은 소스에 APP_STORE 조건을 켜서 자동 업데이트 코드를 빌드에서 뺀다.
  # Sparkle 은 의존에 넣지 않는다 (가이드라인 2.4.5(vii) — 업데이트는 App Store 만 맡는다).
  # 번들 ID 는 dmg판과 같다 (플랜 008 결정). 로컬 확인 빌드는 명령줄에서 접미사 ID 로 덮어 설치본과 분리한다.
  # App Sandbox 는 TASK-113 에서 켰다 (권한은 실험에서 필요했던 두 가지만 — StashAppStore.entitlements).
  # 배포 서명(TASK-116)은 Release 만 Xcode 자동 서명이다. 배포 인증서·App Store 프로파일은 Xcode 가 만든다
  # (Scripts/build-appstore.sh 가 -allowProvisioningUpdates 로 아카이브·내보내기). Debug 는 로컬 서명 그대로다.
  StashAppStore:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources
    settings:
      base:
        PRODUCT_NAME: Stash
        PRODUCT_BUNDLE_IDENTIFIER: com.angar2.stash
        # 모듈 이름은 dmg판(stash)과 다르게 둔다. 같으면 코드 테스트의 `@testable import stash` 가 이 타깃까지
        # 암묵 의존으로 끌어와, 제품 이름이 같은 두 앱을 한 폴더에 빌드하다 충돌한다.
        PRODUCT_MODULE_NAME: StashAppStore
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: Sources/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "NO"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        ENABLE_APP_SANDBOX: "YES"
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/StashAppStore.entitlements
      # TASK-113 — Debug 는 제품 이름을 따로 둔다. 두 앱 타깃이 같은 Debug/Stash.app 경로를 만들면, dmg판 코드 테스트가
      # 테스트 호스트 경로를 만드는 타깃으로 이 타깃까지 끌어와 "Multiple commands produce" 로 실패한다 (dev 에서도 재현).
      # 배포 빌드(Release)는 위 기본값 Stash 그대로다. 산출 폴더를 가르는 방법은 패키지 산출물을 못 찾아 쓰지 않는다.
      configs:
        Debug:
          PRODUCT_NAME: StashAppStore
        Release:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: L7J8SQ9T5F
    dependencies:
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: GRDB
        product: GRDB
    postBuildScripts:
      # Info.plist 는 dmg판과 한 파일을 쓴다 (버전 표기를 한 곳에서만 고치려고). Sparkle 설정 키(SU…)는 여기서 지운다.
      - name: Sparkle 설정 키 삭제
        script: |
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          for KEY in $(/usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -oE '^    SU[A-Za-z]+' | tr -d ' '); do
            /usr/libexec/PlistBuddy -c "Delete :${KEY}" "$PLIST"
          done
        basedOnDependencyAnalysis: false
      - name: 배포판 묶음 검사
        script: '"${SRCROOT}/Scripts/verify-app-bundle.sh" appstore "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"'
        basedOnDependencyAnalysis: false

  StashTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests/StashTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Stash
      - package: GRDB
        product: GRDB

  StashUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests/StashUITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Stash

